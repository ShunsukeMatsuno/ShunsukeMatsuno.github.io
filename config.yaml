baseURL: https://shunsukematsuno.github.io/
theme: hugo-sleek
publishDir: docs
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
languages:
  en:
    locale: en-US
    direction: ltr
    label: English
    weight: 0
  ja:
    locale: ja
    direction: ltr
    label: Japanese
    weight: 1
    title: 松野 舜介 | シカゴ大学ブース・スクール・オブ・ビジネス 会計学助教授
title: Shunsuke Matsuno | Assistant Professor of Accounting, Chicago Booth
enableRobotsTXT: true
summaryLength: 30
disableKinds:
  - taxonomy
  - term
enableGitInfo: true
module:
  hugoVersion:
    extended: true
    min: 0.164.0
  imports:
  - path: github.com/hugomods/images
  # Adding mounts replaces Hugo's defaults, so they are re-declared here.
  # Paper PDFs live in static/papers (old URLs keep working) and are also
  # mounted into each paper's page bundle so the PDF sits in the same
  # directory as its abstract page (required by Google Scholar).
  mounts:
  - source: content
    target: content
  - source: static
    target: static
  - source: layouts
    target: layouts
  - source: assets
    target: assets
  - source: data
    target: data
  - source: i18n
    target: i18n
  - source: archetypes
    target: archetypes
  - source: static/papers/JMP_matsuno.pdf
    target: content/research/gatekeeping-experts-dilemma/Matsuno-Gatekeeping-Experts-Dilemma.pdf
  - source: static/papers/supplementary-material_Gatekeeping-Experts-Dilemma.pdf
    target: content/research/gatekeeping-experts-dilemma/Matsuno-Gatekeeping-Experts-Dilemma-Supplementary-Material.pdf
  - source: static/papers/DynamicLemonsDisclosure.pdf
    target: content/research/mandatory-voluntary-disclosure-dynamic-market-for-lemons/Aghamolla-Matsuno-Mandatory-vs-Voluntary-Disclosure-Dynamic-Market-for-Lemons.pdf
  - source: static/papers/Leadership_Matsuno.pdf
    target: content/research/corporate-culture-conformity-coordination/Matsuno-How-Does-Corporate-Culture-Create-Value.pdf
  - source: static/papers/PCAOB_dynamic.pdf
    target: content/research/pcaob-monitoring-auditor-effort/Liu-Matsuno-PCAOB-Monitoring-and-Auditor-Effort.pdf
  - source: static/papers/StrategicPatenting.pdf
    target: content/research/strategic-patenting-financial-disclosure-mandates/Azinovic-Yang-Chen-Matsuno-Yoo-Strategic-Patenting.pdf
  - source: static/papers/StackelbergDisclosure.pdf
    target: content/research/disclosure-signaling-first-mover-disadvantage/Matsuno-Disclosure-Signaling-First-Mover-Disadvantage.pdf
menu:
  main:
    - name: About
      url: /
      weight: 1
    - name: Research
      url: /research
      weight: 2

# services:
#   googleAnalytics:
    
params:
  author:
    email: Shunsuke.Matsuno@chicagobooth.edu
    name: Shunsuke Matsuno
  dateFormat: '2006-01-02'
  description: >-
    Shunsuke Matsuno (松野 舜介) is an Assistant Professor of Accounting at the
    University of Chicago Booth School of Business. His research focuses on information economics and its applications to accounting.
  images:
  - images/Shunsuke-Matsuno_BW_2025-May.jpg
  title: Personal Website of Shunsuke Matsuno (松野 舜介)
  header: "Shunsuke Matsuno"
  github: "ShunsukeMatsuno"
  googleScholar: "p4Qxc5YAAAAJ"
  ssrn: "https://papers.ssrn.com/sol3/cf_dev/AbsByAuth.cfm?per_id=5017016"
  facultyPage: "https://www.chicagobooth.edu/faculty/directory/m/shunsuke-matsuno"
  affiliation: "The University of Chicago Booth School of Business"
  
markup:
  goldmark:
    renderer:
      unsafe: true
    renderHooks:
      link:
        useEmbedded: auto

frontmatter:
  date:
  - myDate
  - :default
  lastmod:
  - :git
  - lastmod

security:
  funcs:
    getenv:
    - ^HUGO_
    - ^CI$
    - ^USER$
    - ^HOME$
    - ^GOOGLE_ANALYTICS_ID$

pygmentsCodeFences: true
pygmentsCodefencesGuessSyntax: true
pygmentsUseClasses: true
