baseURL: https://shunsukematsuno.github.io/
theme: hugo-sleek
publishDir: docs
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
languages:
  en:
    locale: en-US
    direction: ltr
    label: English
    weight: 0
  ja:
    locale: ja
    direction: ltr
    label: Japanese
    weight: 1
    title: 松野舜介 - Personal Website | Chicago Booth
title: Shunsuke Matsuno | Assistant Professor of Accounting, Chicago Booth
enableRobotsTXT: true
summaryLength: 30
disableKinds:
  - taxonomy
  - term
enableGitInfo: true
module:
  hugoVersion:
    extended: true
    min: 0.164.0
    summaryLength: 30
  imports:
  - path: github.com/hugomods/images
menu:
  main:
    - name: About
      url: /
      weight: 1
    - name: Research
      url: /research
      weight: 2

# services:
#   googleAnalytics:
    
params:
  author:
    email: Shunsuke.Matsuno@chicagobooth.edu
    name: Shunsuke Matsuno
  dateFormat: '2006-01-02'
  description: >-
    Shunsuke Matsuno (松野 舜介) is an Assistant Professor of Accounting at the
    University of Chicago Booth School of Business. His research focuses on information economics and its applications to accounting.
  images:
  - images/Shunsuke-Matsuno_BW_2025-May.jpg
  title: Personal Website of Shunsuke Matsuno (松野 舜介)
  header: "Shunsuke Matsuno"
  github: "ShunsukeMatsuno"
  googleScholar: "p4Qxc5YAAAAJ"
  ssrn: "https://papers.ssrn.com/sol3/cf_dev/AbsByAuth.cfm?per_id=5017016"
  facultyPage: "https://www.chicagobooth.edu/faculty/directory/m/shunsuke-matsuno"
  affiliation: "The University of Chicago Booth School of Business"
  
markup:
  goldmark:
    renderer:
      unsafe: true
    renderHooks:
      link:
        useEmbedded: auto

frontmatter:
  date:
  - myDate
  - :default
  lastmod:
  - :git
  - lastmod

security:
  funcs:
    getenv:
    - ^HUGO_
    - ^CI$
    - ^USER$
    - ^HOME$
    - ^GOOGLE_ANALYTICS_ID$

pygmentsCodeFences: true
pygmentsCodefencesGuessSyntax: true
pygmentsUseClasses: true
